name: tests

on:
  push:
  pull_request:
  workflow_call:      # also the gate for the live tiers (live.yml)

permissions:
  contents: read

jobs:
  offline-tests:
    name: Offline tests (no AWS credentials needed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          pip install -r tests/hunts/requirements.txt \
                      -r tests/scheduled/requirements.txt \
                      -r tests/sigma/requirements.txt

      - name: Sigma output is up to date
        run: python3 scripts/sigma_convert.py --check

      - name: Curated threat-intel indicators
        run: python3 tests/intel/test_indicators.py

      - name: IP key and CIDR range SQL (vs Python ipaddress)
        run: python3 tests/hunts/test_ip_keys.py

      - name: Hunts, scheduled and retro variants
        run: python3 tests/hunts/test_hunts.py

      - name: Scheduled-hunts state machine data flow
        run: python3 tests/scheduled/test_state_machine.py

      - name: Sigma converter (three-way differential)
        run: python3 tests/sigma/test_sigma.py

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Live harness, offline (renders the catalogue with Terraform; no AWS)
        run: |
          pip install -r tests/live/requirements.txt
          python3 tests/live/test_harness_offline.py

      - name: Multi-account roots (offline plans) and the verification script
        run: |
          python3 tests/org/test_org_plans.py
          python3 tests/org/test_verify_org.py

      - name: State machine definition is valid ASL
        run: |
          python3 -c "import json,sys; sys.path.insert(0,'tests/scheduled'); import test_state_machine as t; print(json.dumps(t.render()))" > /tmp/hunts.asl.json
          npx --yes asl-validator --json-path /tmp/hunts.asl.json

  terraform:
    name: Terraform fmt and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - name: Validate the other roots
        run: |
          for d in ci/bootstrap ci/render-catalogue org/management org/security-admin; do
            terraform -chdir="$d" init -backend=false -input=false && terraform -chdir="$d" validate
          done

  terratest-unit:
    # Terratest unit tier: plans module fixtures offline (faked credentials, no
    # AWS calls) and asserts on the planned resources. Integration tests in the
    # same suite skip themselves without TERRATEST_LIVE=1.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: test/go.mod
          cache-dependency-path: test/go.sum
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false   # the wrapper script breaks Terratest's parsing of terraform output
      - run: mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - name: go vet
        working-directory: test
        run: go vet ./...
      - name: Terratest unit tier
        working-directory: test
        run: go test ./... -count=1 -timeout 25m -v
