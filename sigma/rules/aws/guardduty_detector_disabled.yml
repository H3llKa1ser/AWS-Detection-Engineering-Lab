title: GuardDuty Detector Deleted or Disabled
id: 6d0f5b4e-9a8f-4a52-8f3c-2b6f0c1d7e01
status: experimental
description: A GuardDuty detector was deleted, or updated with enable set to false, removing managed threat detection from the region.
author: AWS Detection Engineering Lab
date: 2026-10-08
tags:
  - attack.defense-evasion
  - attack.t1562.001
logsource:
  product: aws
  service: cloudtrail
detection:
  selection_delete:
    eventSource: guardduty.amazonaws.com
    eventName: DeleteDetector
  selection_disable:
    eventSource: guardduty.amazonaws.com
    eventName: UpdateDetector
    requestParameters.enable: false
  condition: 1 of selection_*
falsepositives:
  - Decommissioning a region or account
level: high
