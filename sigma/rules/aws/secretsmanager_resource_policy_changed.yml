title: Secrets Manager Resource Policy Changed
id: 6d0f5b4e-9a8f-4a52-8f3c-2b6f0c1d7e07
status: experimental
description: A resource policy on a secret was put or deleted, which can grant another principal or account read access to it.
author: AWS Detection Engineering Lab
date: 2026-10-08
tags:
  - attack.persistence
  - attack.t1098
  - attack.credential-access
  - attack.t1555.006
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: secretsmanager.amazonaws.com
    eventName:
      - PutResourcePolicy
      - DeleteResourcePolicy
  filter_failed:
    errorCode: '*'
  condition: selection and not filter_failed
falsepositives:
  - Infrastructure-as-code deployments managing secret policies
level: medium
